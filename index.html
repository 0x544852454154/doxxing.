    for (let i = 0; i < n; i++) {
      const c = cells[i];
      if (c.ch === ' ' && !(c.lum > 40 && rnd(i, 7) < .05)) continue;    // a few blank cells flicker as stray dots

        case 'light':   p = 1 - c.lum / 255; break;
        case 'sparkle': p = rnd(i, 5); break;

    this.gStart = now + end * .85; this.gDur = 800;     // glow blooms in after the glyphs, so the picture never shows before the reveal
  }
  stepIntro(now) {
    const t = this.t = now - this.t0, { order, delays, scr } = this.tl, cells = this.data.cells;
    while (this.ptr < order.length && delays[order[this.ptr]] <= t) this.active.push(order[this.ptr++]);
    for (let a = 0; a < this.active.length;) {
      const i = this.active[a];
      if (t >= delays[i] + scr[i]) {                       // glyph locks in
        this.done[i] = 1; const c = cells[i];
        if (c.ch !== ' ' && !this.flick[i]) this.glyph(this.lx, c.ch, i, c.col, 1);

  shimmer(now) {
    const D = this.data, cells = D.cells, cols = D.cols, rows = D.rows, x = this.x, ov = this.cfg.light ? '#000' : '#ff4a68';
    // 1. soft light band sweeping across
    const bp = ((now % 9000) / 9000) * 1.5 - .25, W = .07;
    const c0 = Math.max(0, Math.floor((bp - W - .15) / .85 * cols)), c1 = Math.min(cols - 1, Math.ceil((bp + W) / .85 * cols));

    const target = Math.max(8, Math.round(cells.length / 380));
    for (let s = 0, n = 0; this.tw.length < target && s < 3; s++) {
      const stray = Math.random() < .22;
      for (let tries = 0; tries < 6; tries++) {
        const i = (Math.random() * cells.length) | 0, c = cells[i];
        if (stray ? (c.ch === ' ' && c.lum > 45) : c.ch !== ' ') { this.tw.push({ i, b: now, life: 500 + Math.random() * 900, stray }); break; }
      }
    }
    for (let a = this.tw.length - 1; a >= 0; a--) {
      const w = this.tw[a], u = (now - w.b) / w.life;
      if (u >= 1) { this.tw[a] = this.tw[this.tw.length - 1]; this.tw.pop(); continue; }
      const al = Math.sin(Math.PI * u);
      if (w.stray) this.glyph(x, this.pool[(rnd(w.i, 9) * this.pool.length) | 0], w.i, ov, al * .45);
      else this.glyph(x, cells[w.i].ch, w.i, ov, al * .8);
    }
    // 3. pointer proximity glow
    if (this.pointer) {
      const R = 7, pc = this.pointer.c, pr = this.pointer.r;
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
        const d = Math.hypot(dx, dy); if (d >= R) continue;
        const cc = pc + dx, rr = pr + dy; if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
        const i = rr * cols + cc, cell = cells[i]; if (cell.ch === ' ') continue;
        const a = 1 - d / R; this.glyph(x, cell.ch, i, ov, a * a * .9);
      }
    }
    x.globalAlpha = 1;
  }
  setPointer(ev) {
    if (!ev) { this.pointer = null; return; }
    const r = this.c.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * this.Wd, py = (ev.clientY - r.top) / r.height * this.Hd;
    this.pointer = { c: Math.floor((px - this.padD) / this.cwD), r: Math.floor((py - this.padD) / this.chD) };
  }

  /* compose one frame; returns true while the intro is still running */
  draw(now) {
    const cfg = this.cfg, x = this.x; let animating = false;

    // glow: wide halo + sharp "image bleed" (the photo showing through the gaps between glyphs)
    const fade = this.gStart == null ? 1 : easeOut(clamp((now - this.gStart) / this.gDur, 0, 1)), D = this.data;
    if (this.gStart != null && now < this.gStart + this.gDur) animating = true;
    let ga = cfg.glow * fade;
    if (fade >= 1 && cfg.shimmer) ga *= 1 + .07 * Math.sin(now / 1300);
    x.globalCompositeOperation = cfg.light ? 'multiply' : 'lighter';
    if (ga > .003 && this.g) {
      const { gw, gh, m } = this.g, scx = D.cols * this.cwD / gw, scy = D.rows * this.chD / gh;
      x.globalAlpha = clamp(ga, 0, 1);
      x.drawImage(this.glowC, this.padD - m * scx, this.padD - m * scy, (gw + 2 * m) * scx, (gh + 2 * m) * scy);
    }
    const bl = (cfg.bleed || 0) * fade;
    if (bl > .003 && D.core) { x.globalAlpha = clamp(bl, 0, 1); x.drawImage(D.core, this.padD, this.padD, D.cols * this.cwD, D.rows * this.chD); }
    x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
    x.drawImage(this.layer, 0, 0);
    this.prep(x);
    if (this.flickList.length) this.drawFlicker(now);
    if (this.mode === 'intro') this.drawActive();
    else if (cfg.shimmer) this.shimmer(now);
    x.globalAlpha = 1;
    return animating;
  }
}

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent), cfg = P.cfg, n = P.cols * P.rows, i;
  var chs = Array.from(P.chars), alts = Array.from(P.alts), cells = new Array(n);
  for (i = 0; i < n; i++) {
    var lum = parseInt(P.lum.substr(i * 2, 2), 16), col;
    col = 'rgba(' + P.mono.join(',') + ',' + (parseInt(P.cb.substr(i * 2, 2), 16) / 255).toFixed(2) + ')';
    cells[i] = { ch: chs[i], alt: alts[i], col: col, lum: lum };
  }
  var raw = atob(P.glow), glow = new Uint8ClampedArray(n * 4);
  for (i = 0; i < n; i++) { glow[i*4] = raw.charCodeAt(i*3); glow[i*4+1] = raw.charCodeAt(i*3+1); glow[i*4+2] = raw.charCodeAt(i*3+2); glow[i*4+3] = 255; }
  var data = { cols: P.cols, rows: P.rows, cells: cells, glow: glow, core: null };

  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { cfg.shimmer = false; cfg.flick = false; cfg.anim = 'none'; }

  var intro = document.getElementById('intro'), site = document.getElementById('site'),
      hint = document.getElementById('hint'),
      cv = document.getElementById('c'), eng = new Engine(cv), raf = 0, last = 0,
      entered = false, holdTimer = 0, introStart = 0;

  /* the art only fills the middle of the grid, so size the canvas to the art's bounding box (not the whole grid) */
  var minc = P.cols, maxc = 0, minr = P.rows, maxr = 0;
  for (i = 0; i < n; i++) if (cells[i].ch !== ' ') {
    var cc = i % P.cols, rr = (i / P.cols) | 0;
    if (cc < minc) minc = cc; if (cc > maxc) maxc = cc; if (rr < minr) minr = rr; if (rr > maxr) maxr = rr;
  }
  function fit() {
    var s = Engine.size(data, cfg), f = cfg.font, cw = f * cfg.cw,
        bw = (maxc - minc + 1) * cw, bh = (maxr - minr + 1) * f,
        z = Math.min(innerWidth * .66 / bw, innerHeight * .62 / bh);
    cv.style.width = (s.W * z) + 'px'; cv.style.height = (s.H * z) + 'px';
    // keep the art itself centred even though it isn't centred inside the grid
    var ox = (P.cols / 2 - (minc + maxc + 1) / 2) * cw * z, oy = (P.rows / 2 - (minr + maxr + 1) / 2) * f * z;
    cv.style.position = 'relative'; cv.style.left = ox + 'px'; cv.style.top = oy + 'px';
    return Math.min(z * Math.min(2, window.devicePixelRatio || 1), 6);
  }
  function tick(now) {
    raf = 0;
    if (eng.mode !== 'intro' && now - last < 30) { raf = requestAnimationFrame(tick); return; }
    last = now;
    var a = eng.draw(now);
    if (!entered && (a || (cfg.shimmer && !document.hidden))) raf = requestAnimationFrame(tick);
  }
  function wake() { if (!raf && !entered) raf = requestAnimationFrame(tick); }

  /* ── transition into the main site ── */
  function enter() {
    if (entered) return;
    entered = true; clearTimeout(holdTimer);
    intro.classList.add('leaving');
    document.body.classList.add('entered');
    site.removeAttribute('inert');
    window.dispatchEvent(new Event('site-enter'));
    document.body.classList.remove('locked');
    window.scrollTo(0, 0);
    var wait = reduced ? 50 : 1500;
    setTimeout(function () {                     // landing is fully faded: free the canvas + animation loop
      if (raf) cancelAnimationFrame(raf);
      cfg.shimmer = false;
      intro.parentNode && intro.parentNode.removeChild(intro);
    }, wait);
  }
  window.addEventListener('keydown', function (e) { if (!entered && e.key !== 'Tab') enter(); });
  intro.addEventListener('click', enter);

  function introDone() {
    hint.classList.add('show');
    holdTimer = setTimeout(enter, 1600);         // short beat on the finished art, then auto-enter
  }

  function boot() {
    eng.setup(data, cfg, fit());
    if (cfg.anim !== 'none') { eng.onDone = introDone; eng.startIntro(performance.now()); }

    wake();
    addEventListener('resize', function () { if (!entered) { eng.relayout(fit()); wake(); } });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });
    if (cfg.shimmer) {
      cv.addEventListener('pointermove', function (e) { eng.setPointer(e); wake(); });
      cv.addEventListener('pointerleave', function () { eng.setPointer(null); });
    }
  }
  boot();
})();
</script>
